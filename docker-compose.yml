services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hireproof_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-hireproof}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The whole product, built from this checkout:
  #   docker compose --profile app up --build
  # Web on http://localhost:3000 (WEB_PORT), API on http://localhost:4000 (API_PORT).
  # Then seed from your machine with npm run db:seed (see docs/deployment.md).
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The same memory as Render's free instance, so a local run shows what it will do.
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-hireproof}:${POSTGRES_PASSWORD:-hireproof_local_only}@db:5432/${POSTGRES_DB:-hireproof}
      TRUST_PROXY: "1"
      CV_CONCURRENCY: ${CV_CONCURRENCY:-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PARSE_MODEL: ${LLM_PARSE_MODEL:-}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_DEMO_LOGINS: ${NEXT_PUBLIC_DEMO_LOGINS:-}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-}
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
