name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PORT: 4000
      DATABASE_URL: postgresql://hireproof:hireproof_ci@localhost:5432/hireproof_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hireproof
          POSTGRES_PASSWORD: hireproof_ci
          POSTGRES_DB: hireproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hireproof -d hireproof_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      # Every commit is scanned, so the whole history is fetched.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1
          git /repo --log-opts="--all" --redact --verbose

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t hireproof-api:ci .
